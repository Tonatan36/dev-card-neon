<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ewerton Natan | Dev Card Neon</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 20px;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
            text-align: center;
            width: 300px;
            transition: 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px #0ff;
        }
        .perfil img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #0ff;
            margin-bottom: 1rem;
            object-fit: cover;
        }
        .link-neon {
            display: block;
            margin: 1rem 0;
            padding: 0.8rem;
            color: #0ff;
            text-decoration: none;
            border: 1px solid #0ff;
            border-radius: 10px;
            transition: 0.3s;
            background: transparent;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        .link-neon:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }
        h1 { margin: 0.5rem 0; font-size: 1.5rem; }
        p { color: #888; margin-bottom: 1.5rem; }
    </style>
</head>
<body>

    <div class="card">
        <div class="perfil">
            <!-- Foto do GitHub -->
            <img src="https://github.com/Tonatan36.png" alt="Foto de Ewerton Natan">
            <h1>Ewerton Natan</h1>
            <p>Estudante de ADS & Dev Web</p>
        </div>
        
        <div class="links">
            <a href="https://github.com/Tonatan36" target="_blank" class="link-neon">GitHub</a>
            <a href="https://www.linkedin.com/in/ewerton-natan-b9ab5238b" target="_blank" class="link-neon">LinkedIn</a>
            <!-- Link do seu WhatsApp -->
            <a href="https://wa.me/5583987225580" target="_blank" class="link-neon">WhatsApp</a>
        </div>
    </div>

</body>
</html>
